<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adam Battle v4</title>
<style>
body { margin: 0; background: #000; color: #fff; text-align: center; font-family: Arial, sans-serif; user-select: none; }
.ta { font-family: "Latha", "Nirmala UI", "Noto Sans Tamil", Arial, sans-serif; }
#splash { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
#splash h1 { font-size: 46px; margin: 0 0 12px; color: #fff; }
#splash h2 { font-size: 30px; margin: 0 0 40px; letter-spacing: 3px; color: #39e6ff; }
canvas { width: 100%; max-width: 480px; border: 2px solid #39e6ff; touch-action: none; display: block; margin: 0 auto; }
button { padding: 12px 14px; margin: 3px; border: 0; border-radius: 10px; background: #16bce0; color: #0b0f1a; font-size: 15px; font-weight: bold; }
button:disabled { background: #33405a; color: #7d8aa3; }
#restart { background: #ffe66d; }
#start { font-size: 20px; padding: 16px 28px; }
.row { margin-top: 6px; }
</style>
</head>
<body>

<div id="splash">
  <h1 class="ta">வணக்கம்</h1>
  <h2>ADAM BATTLE</h2>
  <button id="start" class="ta">▶ விளையாடு / PLAY</button>
</div>

<div id="game" style="display:none">
  <h3 style="margin:8px 0 4px">ADAM BATTLE</h3>
  <div>Score <span id="score">0</span> &nbsp;·&nbsp; 🪙 Adam Coin <span id="coins">0</span> &nbsp; <button id="mute">🔊</button></div>
  <canvas id="canvas" width="360" height="520"></canvas>
  <div class="row">
    <button id="left">⬅️</button>
    <button id="shoot">🔫 FIRE</button>
    <button id="right">➡️</button>
  </div>
  <div class="row" id="weapons"></div>
  <div class="row"><button id="restart" style="display:none">🔄 RESTART</button></div>
</div>

<script>
const W = 360, H = 520, HORIZON = 130, GROUND = 470;
const cv = document.getElementById("canvas");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const WEAPONS = [
  { name: "Pistol", cost: 0,  delay: 18, dmg: 1, color: "#ffe66d" },
  { name: "AK",     cost: 10, delay: 8,  dmg: 2, color: "#ffb347" },
  { name: "M4A1",   cost: 20, delay: 6,  dmg: 2, color: "#9ef01a" },
  { name: "P90",    cost: 30, delay: 4,  dmg: 1, color: "#4cc9f0" },
  { name: "MP40",   cost: 25, delay: 7,  dmg: 3, color: "#f72585" }
];

/* ---------- SOUND (Web Audio API, no files needed) ---------- */
let AC = null, muted = false;

function initAudio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
}

function beep(freq, dur, type = "square", vol = 0.15, slideTo = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noise(dur, vol, freq) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource();
  src.buffer = buf;
  const f = AC.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = freq;
  const g = AC.createGain();
  const t = AC.currentTime;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(AC.destination);
  src.start(t);
}

const sfx = {
  shot(w) {
    const p = [[0.12, 0.25, 1400], [0.1, 0.35, 1100], [0.08, 0.3, 1600], [0.05, 0.22, 2000], [0.07, 0.3, 900]][w];
    noise(p[0], p[1], p[2]);
    beep(120, 0.1, "sine", 0.3, 50);
  },
  hit()   { beep(300, 0.08, "square", 0.12, 150); },
  kill()  { noise(0.25, 0.3, 800); beep(200, 0.25, "sawtooth", 0.15, 60); },
  coin()  { beep(1200, 0.08, "sine", 0.2); beep(1600, 0.12, "sine", 0.2, null, 0.08); },
  med()   { beep(500, 0.1, "triangle", 0.2); beep(700, 0.15, "triangle", 0.2, null, 0.1); },
  hurt()  { beep(220, 0.35, "sawtooth", 0.25, 60); noise(0.2, 0.2, 400); },
  buy()   { [523, 659, 784].forEach((f, i) => beep(f, 0.15, "square", 0.12, null, i * 0.1)); },
  over()  { [392, 330, 262, 196].forEach((f, i) => beep(f, 0.35, "triangle", 0.2, null, i * 0.3)); }
};

$("mute").addEventListener("click", () => {
  muted = !muted;
  $("mute").textContent = muted ? "🔇" : "🔊";
});

/* ---------- STATE ---------- */
let s;

function reset() {
  s = {
    lane: 0, move: 0, shooting: false, cool: 0,
    hp: 3, maxHp: 3, coins: 0, score: 0, frame: 0, flash: 0, over: false,
    weapon: 0, owned: [true, false, false, false, false],
    enemies: [], bullets: [], loot: []
  };
  $("restart").style.display = "none";
  hud();
}

// Pseudo-3D projection: d = 0 far away (horizon), d = 1 right at the player
function proj(lane, d) {
  return {
    x: W / 2 + lane * (30 + 120 * d),
    y: HORIZON + (GROUND - HORIZON) * d,
    scale: 0.25 + 0.9 * d
  };
}

function spawn() {
  const hp = 1 + Math.floor(s.score / 10);
  s.enemies.push({
    lane: Math.random() * 1.7 - 0.85,
    d: 0,
    speed: 0.0018 + Math.random() * 0.0012 + s.score * 0.00004,
    hp, maxHp: hp,
    type: Math.random() < 0.3 ? "commander" : "guard",
    phase: Math.random() * 6
  });
}

function pick(i) {
  if (!s || s.over) return;
  if (!s.owned[i]) {
    if (s.coins < WEAPONS[i].cost) return;
    s.coins -= WEAPONS[i].cost;
    s.owned[i] = true;
    sfx.buy();
  }
  s.weapon = i;
  hud();
}

function buildWeaponButtons() {
  const box = $("weapons");
  WEAPONS.forEach((w, i) => {
    const b = document.createElement("button");
    b.id = "w" + i;
    b.addEventListener("click", () => { initAudio(); pick(i); });
    box.appendChild(b);
  });
}

function hud() {
  $("score").textContent = s.score;
  $("coins").textContent = s.coins;
  WEAPONS.forEach((w, i) => {
    const b = $("w" + i);
    let label = (i + 1) + " " + w.name;
    if (!s.owned[i]) label += " 🔒" + w.cost;
    else if (s.weapon === i) label += " ✅";
    b.textContent = label;
    b.disabled = !s.owned[i] && s.coins < w.cost;
  });
}

/* ---------- UPDATE ---------- */
function update() {
  s.frame++;

  if (s.move) s.lane = clamp(s.lane + s.move * 0.035, -1, 1);

  const w = WEAPONS[s.weapon];
  if (s.shooting && s.cool <= 0) {
    s.bullets.push({ lane: s.lane, d: 0.98, dmg: w.dmg });
    s.cool = w.delay;
    sfx.shot(s.weapon);
  }
  if (s.cool > 0) s.cool--;

  const every = Math.max(35, 80 - Math.floor(s.score / 3) * 2);
  if (s.frame % every === 0) spawn();

  s.enemies.forEach(e => {
    e.d += e.speed;
    e.lane = clamp(e.lane + Math.sin(s.frame / 30 + e.phase) * 0.002, -0.95, 0.95);
  });

  s.bullets.forEach(b => b.d -= 0.04);

  // Bullets vs enemies
  for (let j = s.bullets.length - 1; j >= 0; j--) {
    const b = s.bullets[j];
    if (b.d < 0) { s.bullets.splice(j, 1); continue; }
    for (let i = s.enemies.length - 1; i >= 0; i--) {
      const e = s.enemies[i];
      if (Math.abs(b.lane - e.lane) < 0.22 && Math.abs(b.d - e.d) < 0.05) {
        e.hp -= b.dmg;
        s.bullets.splice(j, 1);
        if (e.hp <= 0) {
          s.enemies.splice(i, 1);
          s.score++;
          sfx.kill();
          s.loot.push({ lane: e.lane, d: e.d, type: "coin" });
          if (Math.random() < 0.1) s.loot.push({ lane: e.lane, d: e.d, type: "med" });
        } else {
          sfx.hit();
        }
        break;
      }
    }
  }

  // Enemies reaching the front hurt you if in your lane
  s.enemies = s.enemies.filter(e => {
    if (e.d >= 1) {
      if (Math.abs(e.lane - s.lane) < 0.3) {
        s.hp--;
        s.flash = 10;
        sfx.hurt();
      }
      return false;
    }
    return true;
  });

  // Loot drifts toward you
  s.loot.forEach(l => l.d += 0.008);
  s.loot = s.loot.filter(l => {
    if (l.d >= 0.9 && Math.abs(l.lane - s.lane) < 0.3) {
      if (l.type === "coin") { s.coins++; sfx.coin(); }
      else { s.hp = Math.min(s.maxHp, s.hp + 1); sfx.med(); }
      return false;
    }
    return l.d < 1.05;
  });

  if (s.hp <= 0) {
    s.hp = 0;
    s.over = true;
    sfx.over();
    $("restart").style.display = "inline-block";
  }
  if (s.flash > 0) s.flash--;
  hud();
}

/* ---------- DRAW ---------- */
function blob(x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawSurvey() {
  // Night sky
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, "#05080f");
  sky.addColorStop(1, "#1b2a3f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, HORIZON);

  // Distant hills
  ctx.fillStyle = "#0e1820";
  ctx.beginPath();
  ctx.moveTo(0, HORIZON);
  ctx.lineTo(0, HORIZON - 20);
  ctx.lineTo(70, HORIZON - 34);
  ctx.lineTo(150, HORIZON - 16);
  ctx.lineTo(230, HORIZON - 30);
  ctx.lineTo(W, HORIZON - 18);
  ctx.lineTo(W, HORIZON);
  ctx.fill();

  // Watchtowers with blinking lights
  [40, 320].forEach((x, idx) => {
    ctx.fillStyle = "#12161d";
    ctx.fillRect(x - 6, HORIZON - 40, 12, 40);
    ctx.fillRect(x - 10, HORIZON - 46, 20, 8);
    const on = Math.floor(s.frame / 40 + idx) % 2 === 0;
    ctx.fillStyle = on ? "#ffd27a" : "#4a3a1c";
    ctx.fillRect(x - 3, HORIZON - 44, 6, 3);
  });

  // Concrete ground
  const ground = ctx.createLinearGradient(0, HORIZON, 0, H);
  ground.addColorStop(0, "#3a3f47");
  ground.addColorStop(1, "#1a1d22");
  ctx.fillStyle = ground;
  ctx.fillRect(0, HORIZON, W, H - HORIZON);

  // Perspective floor lines
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  for (let k = -6; k <= 6; k++) {
    ctx.beginPath();
    ctx.moveTo(W / 2, HORIZON);
    ctx.lineTo(W / 2 + k * 70, H);
    ctx.stroke();
  }

  // Chain-link fences on both sides, moving toward the player
  [-1.3, 1.3].forEach(lane => {
    const posts = [];
    for (let k = 0; k < 12; k++) {
      const d = ((k / 12) + s.frame * 0.004) % 1;
      posts.push({ d, p: proj(lane, d) });
    }
    posts.sort((a, b) => a.d - b.d);
    // Fence wire
    ctx.strokeStyle = "rgba(200,210,220,0.45)";
    ctx.beginPath();
    posts.forEach((q, i) => (i ? ctx.lineTo(q.p.x, q.p.y - 30 * q.p.scale) : ctx.moveTo(q.p.x, q.p.y - 30 * q.p.scale)));
    ctx.stroke();
    // Posts
    ctx.strokeStyle = "#8c96a0";
    posts.forEach(q => {
      ctx.beginPath();
      ctx.moveTo(q.p.x, q.p.y);
      ctx.lineTo(q.p.x, q.p.y - 30 * q.p.scale);
      ctx.stroke();
    });
  });
}

function drawGuard(e, p, z) {
  const bob = Math.sin(s.frame / 10 + e.phase) * 1.5 * z;
  const step = Math.round(Math.sin(s.frame / 8 + e.phase) * 3 * z);
  const uniform = e.type === "commander" ? "#1c1f26" : "#4b5b3a";
  const helmet = e.type === "commander" ? "#0d0f13" : "#2e3a26";
  const dark = e.type === "commander" ? "#101217" : "#36432b";

  ctx.save();
  ctx.translate(p.x, p.y + bob);

  // Legs with walking motion
  ctx.fillStyle = dark;
  ctx.fillRect(-9 * z + step, -14 * z, 7 * z, 14 * z);
  ctx.fillRect(2 * z - step, -14 * z, 7 * z, 14 * z);
  // Boots
  ctx.fillStyle = "#111";
  ctx.fillRect(-10 * z + step, -2 * z, 8 * z, 3 * z);
  ctx.fillRect(2 * z - step, -2 * z, 8 * z, 3 * z);

  // Torso and tactical vest
  ctx.fillStyle = uniform;
  ctx.fillRect(-12 * z, -44 * z, 24 * z, 32 * z);
  ctx.fillStyle = "rgba(0,0,0,0.35)";                 // shading on one side
  ctx.fillRect(4 * z, -44 * z, 8 * z, 32 * z);
  ctx.fillStyle = "#1a1f14";                          // vest pouches
  ctx.fillRect(-9 * z, -34 * z, 6 * z, 8 * z);
  ctx.fillRect(3 * z, -34 * z, 6 * z, 8 * z);

  // Arms holding rifle
  ctx.fillStyle = uniform;
  ctx.fillRect(-16 * z, -40 * z, 5 * z, 20 * z);
  ctx.fillRect(11 * z, -40 * z, 5 * z, 20 * z);
  ctx.fillStyle = "#222";                             // rifle
  ctx.fillRect(-10 * z, -26 * z, 26 * z, 3 * z);
  ctx.fillRect(-16 * z, -28 * z, 6 * z, 6 * z);

  // Head and helmet
  ctx.fillStyle = "#c89873";
  blob(0, -52 * z, 7 * z, 8 * z);
  ctx.fillStyle = helmet;
  ctx.beginPath();
  ctx.arc(0, -55 * z, 10 * z, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-10 * z, -55 * z, 20 * z, 2 * z);
  ctx.fillStyle = "#000";                             // eyes
  ctx.fillRect(-4 * z, -52 * z, 2 * z, 1.5 * z);
  ctx.fillRect(2 * z, -52 * z, 2 * z, 1.5 * z);

  // HP bar for tougher enemies
  if (e.maxHp > 1) {
    ctx.fillStyle = "#333";
    ctx.fillRect(-18 * z, -72 * z, 36 * z, 4 * z);
    ctx.fillStyle = "#6dff8a";
    ctx.fillRect(-18 * z, -72 * z, 36 * z * (e.hp / e.maxHp), 4 * z);
  }
  ctx.restore();
}

function drawLoot(l) {
  const p = proj(l.lane, l.d);
  ctx.font = (16 * p.scale + 6) + "px Arial";
  ctx.textAlign = "center";
  ctx.fillText(l.type === "coin" ? "🪙" : "💊", p.x, p.y);
}

function drawBullet(b) {
  const p = proj(b.lane, b.d);
  ctx.fillStyle = WEAPONS[s.weapon].color;
  ctx.fillRect(p.x - 1.5 * p.scale, p.y - 12 * p.scale, 3 * p.scale, 10 * p.scale);
}

function drawHero() {
  const p = proj(s.lane, 1);
  ctx.save();
  ctx.translate(p.x, GROUND);
  ctx.fillStyle = "#2b3340";                          // legs
  ctx.fillRect(-12, -10, 10, 12);
  ctx.fillRect(2, -10, 10, 12);
  ctx.fillStyle = "#1d2633";                          // vest
  ctx.fillRect(-16, -44, 32, 34);
  ctx.fillStyle = "#3a5a40";                          // arms
  ctx.fillRect(-20, -40, 6, 22);
  ctx.fillRect(14, -40, 6, 22);
  ctx.fillStyle = "#333";                             // gun
  ctx.fillRect(10, -30, 30, 6);
  ctx.fillStyle = WEAPONS[s.weapon].color;
  ctx.fillRect(10, -30, 30, 2);
  ctx.fillStyle = "#e0a77a";                          // face
  ctx.beginPath(); ctx.arc(0, -54, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3a5a40";                          // helmet
  ctx.beginPath(); ctx.arc(0, -57, 12, Math.PI, 0); ctx.fill();
  ctx.fillRect(-12, -57, 24, 3);
  ctx.strokeStyle = "#c1121f";                        // scar
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(3, -60); ctx.lineTo(7, -52); ctx.stroke();
  ctx.restore();
}

function draw() {
  drawSurvey();

  const items = [
    ...s.enemies.map(e => ({ d: e.d, draw: () => drawGuard(e, proj(e.lane, e.d), proj(e.lane, e.d).scale) })),
    ...s.loot.map(l => ({ d: l.d, draw: () => drawLoot(l) }))
  ].sort((a, b) => a.d - b.d);
  items.forEach(it => it.draw());

  s.bullets.forEach(drawBullet);
  drawHero();

  ctx.textAlign = "left";
  ctx.font = "16px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText("❤️".repeat(s.hp) + "🖤".repeat(s.maxHp - s.hp), 8, 22);
  ctx.textAlign = "right";
  ctx.fillText(WEAPONS[s.weapon].name, W - 8, 22);

  if (s.flash > 0) {
    ctx.fillStyle = "rgba(255,0,0,0.25)";
    ctx.fillRect(0, 0, W, H);
  }

  if (s.over) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "28px Arial";
    ctx.fillText("GAME OVER", W / 2, 240);
    ctx.font = "17px Arial";
    ctx.fillText("Score: " + s.score + "   Adam Coins: " + s.coins, W / 2, 272);
  }
}

/* ---------- CONTROLS ---------- */
function hold(id, value) {
  const b = $(id);
  b.addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); s.move = value; });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
    b.addEventListener(ev, () => { if (s.move === value) s.move = 0; })
  );
}
hold("left", -1);
hold("right", 1);

$("shoot").addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); s.shooting = true; });
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
  $("shoot").addEventListener(ev, () => { s.shooting = false; })
);
$("restart").addEventListener("click", () => { initAudio(); reset(); });

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") s.move = -1;
  if (e.key === "ArrowRight") s.move = 1;
  if (e.key === " ") { s.shooting = true; e.preventDefault(); }
  if (e.key >= "1" && e.key <= "5") pick(Number(e.key) - 1);
});
document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" && s.move === -1) s.move = 0;
  if (e.key === "ArrowRight" && s.move === 1) s.move = 0;
  if (e.key === " ") s.shooting = false;
});

/* ---------- START ---------- */
$("start").addEventListener("click", () => {
  initAudio();
  $("splash").style.display = "none";
  $("game").style.display = "block";
  reset();
});

function loop() {
  if (s && !s.over) update();
  if (s) draw();
  requestAnimationFrame(loop);
}

buildWeaponButtons();
s = null;
reset();
loop();
</script>
</body>
</html>
